name: vemoki

networks:
  internal:
  edge:
    external: true
    name: nginx-letencrypt_nginx_network

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TICKET_APP_PASSWORD: ${TICKET_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    networks:
      - internal

  migrate:
    image: vemoki-runtime:local
    working_dir: /app
    volumes:
      - /opt/vemoki/src:/app
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['pnpm', '--filter', '@ticket/backend', 'exec', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ['start', '--import-realm', '--http-port=8080']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://auth.vemoki.com
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
    volumes:
      - ${REALM_FILE}:/opt/keycloak/data/import/realm-ticket.json:ro
    networks:
      internal: {}
      edge:
        aliases:
          - vemoki-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    image: vemoki-runtime:local
    working_dir: /app
    volumes:
      - /opt/vemoki/src:/app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      DATABASE_URL: postgresql://ticket_app:${TICKET_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_PROVIDER: keycloak
      OIDC_ISSUER: https://auth.vemoki.com/realms/ticket
      OIDC_AUDIENCE: ticket-api
      OIDC_JWKS_URL: https://auth.vemoki.com/realms/ticket/protocol/openid-connect/certs
      CODE_HMAC_PEPPER: ${CODE_HMAC_PEPPER}
      CODE_HMAC_VERSION: '1'
      TICKET_CREDENTIAL_KEY: ${TICKET_CREDENTIAL_KEY}
    command: ['node', 'apps/api/dist/main.js']
    extra_hosts:
      - 'auth.vemoki.com:host-gateway'
    networks:
      internal: {}
      edge:
        aliases:
          - vemoki-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  web:
    image: vemoki-runtime:local
    working_dir: /app
    volumes:
      - /opt/vemoki/src:/app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OIDC_ISSUER: https://auth.vemoki.com/realms/ticket
      OIDC_CLIENT_ID: ticket-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: https://vemoki.com/api/auth/callback
      OIDC_SCOPES: openid profile email
      API_BASE_URL: http://api:3001
      AUTH_COOKIE_SECURE: 'true'
    command: ['pnpm', '--filter', '@ticket/web', 'exec', 'next', 'start', '--hostname', '0.0.0.0', '--port', '3000']
    extra_hosts:
      - 'auth.vemoki.com:host-gateway'
    networks:
      internal: {}
      edge:
        aliases:
          - vemoki-web
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_healthy

  worker:
    image: vemoki-runtime:local
    working_dir: /app
    volumes:
      - /opt/vemoki/src:/app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ticket_app:${TICKET_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: noreply@vemoki.com
      OUTBOX_POLL_MS: '2000'
    command: ['node', 'apps/worker/dist/main.js']
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
