# Snippet for edge nginx (nginx-letencrypt) — portal.vemoki.com → vemoki-portal:3013
# Apply into data/nginx/vemoki.conf on the VPS host (do not compose-up that stack).
# Issue #502 / ADR-20. Keep GATE on app.vemoki.com. Overwrite X-Forwarded-Host $host.

# --- ACME: add portal.vemoki.com to the existing listen 80 server_name list ---
# server_name … portal.vemoki.com;

server {
    listen 443 ssl http2;
    server_name portal.vemoki.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/vemoki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vemoki.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://vemoki-portal:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://0.0.0.0:3013/ https://portal.vemoki.com/;
        proxy_redirect https://0.0.0.0:3013/ https://portal.vemoki.com/;
    }
}
