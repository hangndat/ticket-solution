# Edge nginx (nginx-letencrypt) — Pre hosts → vemoki-pre-* upstreams on shared edge network.
# Append to data/nginx/vemoki.conf (or include). Do not touch prod server_name blocks.
# Overwrite X-Forwarded-Host $host on every location (O13 / OIDC).

# --- ACME: add to the existing listen 80 server_name list (one line) ---
# pre.vemoki.com pre-app.vemoki.com pre-api.vemoki.com pre-auth.vemoki.com pre-portal.vemoki.com

# --- TLS: expand cert vemoki.com SAN with pre-* (certbot --expand) or separate cert; paths below assume vemoki.com cert ---

server {
    listen 443 ssl http2;
    server_name pre.vemoki.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/vemoki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vemoki.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://vemoki-pre-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://0.0.0.0:3000/ https://pre.vemoki.com/;
        proxy_redirect https://0.0.0.0:3000/ https://pre.vemoki.com/;
    }
}

server {
    listen 443 ssl http2;
    server_name pre-app.vemoki.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/vemoki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vemoki.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://vemoki-pre-web:3000;
        proxy_http_version 1.1;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://0.0.0.0:3000/ https://pre-app.vemoki.com/;
        proxy_redirect https://0.0.0.0:3000/ https://pre-app.vemoki.com/;
    }
}

