# Local ADR-15 admission stack (Issue #25) — isolated S4, not production.
# Exact:
#   COMPOSE_PROJECT_NAME=d5-adm \
#   docker compose -f infra/admission/compose.admission.yaml up -d --build
# Tear down: docker compose -f … down -v
#
# Ports (task-specific): edge :18080 · upstream mock :18081

services:
  admission-upstream:
    image: nginx:1.29-alpine
    volumes:
      - ./upstream-mock.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      ticket.task: d5-admission
    networks:
      - d5adm

  admission-edge:
    image: nginx:1.29-alpine
    depends_on:
      - admission-upstream
    ports:
      - '127.0.0.1:${D5_ADMISSION_PORT:-18080}:18080'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      ticket.task: d5-admission
    networks:
      - d5adm

networks:
  d5adm:
    name: d5-admission-${COMPOSE_PROJECT_NAME:-d5-adm}
