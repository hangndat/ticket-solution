# Minimal upstream for admission S4 — not the Nest API.
server {
  listen 18081;
  server_name _;

  location /v1/gate/ {
    add_header Content-Type application/json;
    return 200 '{"ok":true,"path":"gate","bypassAdmission":true}';
  }

  location /events/ {
    add_header Content-Type application/json;
    return 200 '{"ok":true,"path":"sale"}';
  }

  location /api/public/ {
    add_header Content-Type application/json;
    return 200 '{"ok":true,"path":"public"}';
  }

  location /v1/health-sale {
    add_header Content-Type application/json;
    return 200 '{"ok":true,"path":"health-sale"}';
  }

  location / {
    return 404;
  }
}
