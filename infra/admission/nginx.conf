# ADR-15 nginx admission — Gate bypass + conservative limit (Issue #25).
# Measurable local edge for S4; not production deploy.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Conservative: 5 r/s per client IP — overload → 429
  limit_req_zone $binary_remote_addr zone=sale:1m rate=5r/s;
  limit_req_status 429;

  server {
    listen 18080;
    server_name _;

    error_page 429 = @overload;

    location @overload {
      add_header Retry-After 1 always;
      add_header Content-Type application/json always;
      return 429 '{"error":"admission_overload","retryAfterSec":1,"guidance":"backoff+jitter; do not retry Gate via waiting room"}';
    }

    # Gate — never through waiting room / sale rate limit
    location /v1/gate/ {
      proxy_pass http://admission-upstream:18081;
      proxy_http_version 1.1;
    }

    location /events/ {
      limit_req zone=sale burst=2 nodelay;
      proxy_pass http://admission-upstream:18081;
    }

    location /api/public/ {
      limit_req zone=sale burst=2 nodelay;
      proxy_pass http://admission-upstream:18081;
    }

    location /v1/health-sale {
      limit_req zone=sale burst=2 nodelay;
      proxy_pass http://admission-upstream:18081;
    }

    location / {
      return 404;
    }
  }
}
