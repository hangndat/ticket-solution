<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portal shell — EN locale + keyboard sample</title>
  </head>
  <body>
    <a href="#portal-main" class="portal-skip-link">Skip navigation</a>
    <header>
      <div class="portal-header-actions">
        <div class="portal-locale-switch" role="group" aria-label="Language">
          <button type="button" aria-pressed="false" data-testid="portal-locale-vi">Tiếng Việt</button>
          <button type="button" aria-pressed="true" data-testid="portal-locale-en">English</button>
        </div>
      </div>
    </header>
    <main id="portal-main" tabindex="-1">
      <h1>Guests</h1>
      <p role="status">Import, review and export from the server. An unfinished job is not success.</p>
    </main>
  </body>
</html>
