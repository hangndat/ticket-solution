<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Portal gate hint fixture #806</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f5f5; }
    .header { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 16px 24px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .hint { color: rgba(0,0,0,.45); font-size: 14px; }
    .content { max-width: 960px; margin: 24px auto; padding: 24px; background: #fff; border-radius: 8px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    .notice { color: rgba(0,0,0,.45); margin: 0 0 16px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { border: 1px solid #f0f0f0; border-radius: 6px; padding: 12px; }
    .stat label { display: block; color: rgba(0,0,0,.45); font-size: 12px; }
  </style>
</head>
<body>
  <div class="header" data-testid="portal-shell-header">
    <span class="hint" data-testid="gate-ios-scan-hint">Soát vé bằng app Vemoki trên iPhone</span>
    <span>Tài khoản</span>
  </div>
  <div class="content">
    <h1>Báo cáo cổng</h1>
    <p class="notice">Soát vé bằng app Vemoki trên iPhone — không quét trên portal. Portal chỉ hiển thị báo cáo khi máy chủ cấp quyền báo cáo sự kiện.</p>
    <div class="stats">
      <div class="stat"><label>Quota allocated</label><strong>120</strong></div>
      <div class="stat"><label>Capacity</label><strong>200</strong></div>
      <div class="stat"><label>Pending approval</label><strong>3</strong></div>
      <div class="stat"><label>Check-in OK</label><strong>87</strong></div>
    </div>
  </div>
</body>
</html>
