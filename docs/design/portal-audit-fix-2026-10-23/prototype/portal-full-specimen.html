  <style>
    :root {
      --vemoki-primary: #1677ff;
      --vemoki-bg: #f5f5f5;
      --vemoki-container: #ffffff;
      --vemoki-text: rgba(0, 0, 0, 0.88);
      --vemoki-text-secondary: rgba(0, 0, 0, 0.45);
      --vemoki-border: #d9d9d9;
      --sider-w: 220px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--vemoki-bg);
      color: var(--vemoki-text);
    }
    .pd-banner {
      background: #fffbe6;
      border-bottom: 1px solid #ffe58f;
      padding: 6px 12px;
      font-size: 11px;
      color: #614700;
      line-height: 1.35;
    }
    .pd-banner strong { font-weight: 600; }
    .shell-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 0 16px;
      background: var(--vemoki-container);
      border-bottom: 1px solid var(--vemoki-border);
    }
    .shell-header .brand {
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
      flex-shrink: 0;
      color: inherit;
      text-decoration: none;
    }
    .shell-header .header-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .context-strip {
      background: var(--vemoki-container);
      border-bottom: 1px solid var(--vemoki-border);
      padding: 10px 16px;
    }
    .context-strip .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 100%; min-width: 0; }
    .field label { font-size: 12px; color: var(--vemoki-text-secondary); }
    .field .ant-select { width: 100%; }
    .scan-hint { flex: 1 1 100%; font-size: 12px; color: var(--vemoki-text-secondary); margin-top: 4px; }
    @media (min-width: 768px) {
      .shell-header .brand { max-width: 200px; }
      .context-strip .row { flex-wrap: nowrap; }
      .field { flex: 0 1 240px; max-width: 280px; }
      .scan-hint { flex: 1 1 auto; margin-top: 0; margin-left: auto; text-align: right; max-width: 280px; }
    }
    .portal-layout { display: flex; min-height: calc(100vh - 120px); }
    .portal-sider {
      width: var(--sider-w);
      flex-shrink: 0;
      background: #001529;
      color: #fff;
      padding: 8px 0;
      display: none;
    }
    @media (min-width: 768px) { .portal-sider { display: block; } }
    .portal-sider a {
      display: block;
      padding: 8px 16px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 13px;
    }
    .portal-sider a.active { background: var(--vemoki-primary); color: #fff; }
    .portal-sider .group { font-size: 11px; text-transform: uppercase; opacity: 0.45; padding: 12px 16px 4px; }
    .portal-main { flex: 1; min-width: 0; padding: 16px; }
    .demo-meta { font-size: 11px; color: var(--vemoki-text-secondary); margin-bottom: 12px; }
    .preset-bar { margin-bottom: 12px; flex-wrap: wrap; }
    .utc-badge {
      display: inline-block;
      font-size: 11px;
      padding: 0 6px;
      border-radius: 4px;
      background: #f0f5ff;
      color: #0958d9;
      margin-left: 6px;
    }
    .pd-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e6f4ff;
      border-top-color: var(--vemoki-primary);
      border-radius: 50%;
      animation: pd-spin 0.9s linear infinite;
    }
    @keyframes pd-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .pd-spinner { animation: none !important; border-top-color: var(--vemoki-primary); }
    }
    body.rm-reduce .pd-spinner { animation: none !important; }
    .state-chip { font-size: 11px; margin-left: 8px; }
    .fixture-label { color: #ad6800; font-weight: 500; }
    .mobile-nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 4px;
    }
    @media (min-width: 768px) { .mobile-nav { display: none; } }
    .link-header-specimen { font-size: 11px; margin-left: 8px; }
  </style>
</head>

        const d = new Date(iso);
        const fmt = new Intl.DateTimeFormat(loc, {
          timeZone: 'UTC',
          dateStyle: 'medium',
          timeStyle: 'short',
        });
        return fmt.format(d);
      } catch {
        return locale === 'en' ? 'Invalid time' : 'Thời điểm không hợp lệ';
      }

      'platform', 'operator-auth',

    const TABS = ['import', 'pending', 'notifications', 'export'];
    const AUDIT_TABS = ['audit', 'codes', 'jobs'];
    const PLATFORM_TABS = ['tenants', 'audit', 'grants'];
    const STATES = ['ready', 'loading', 'empty', 'error', 'denied', 'unknown'];
    const TENANT_SHORT = 'MFest · Demo (fixture)';
    const TENANT_LONG = 'MFest Productions International · Demo Tenant With A Very Long Display Name (fixture)';
    const EVENT_SHORT = 'Summer Music Festival 2026 (fixture)';
    const EVENT_LONG = 'Summer Music Festival 2026 — Extended Weekend Pass · Ho Chi Minh City (fixture)';

    function App() {
      const params = new URLSearchParams(window.location.search);
      const [locale, setLocale] = useState(params.get('locale') === 'en' ? 'en' : 'vi');
      const [page, setPage] = useState(PAGES.includes(params.get('page')) ? params.get('page') : 'guests');
      const [tab, setTab] = useState(TABS.includes(params.get('tab')) ? params.get('tab') : 'import');
      const [auditTab, setAuditTab] = useState(AUDIT_TABS.includes(params.get('auditTab')) ? params.get('auditTab') : 'audit');
      const [platformTab, setPlatformTab] = useState(PLATFORM_TABS.includes(params.get('platformTab')) ? params.get('platformTab') : 'tenants');
      const [uiState, setUiState] = useState(STATES.includes(params.get('state')) ? params.get('state') : 'ready');
      const [persona, setPersona] = useState(params.get('persona') === 'operator' ? 'operator' : 'owner');
      const useLongLabels = params.get('long') === '1';
      const rmQuery = params.get('rm') === '1';
      const tenantLabel = useLongLabels ? TENANT_LONG : TENANT_SHORT;
      const eventLabel = useLongLabels ? EVENT_LONG : EVENT_SHORT;
      const [dims, setDims] = useState({ w: 0, h: 0 });

      useEffect(() => {
        document.documentElement.lang = locale;
        document.body.classList.toggle('rm-reduce', rmQuery);
      }, [locale, rmQuery]);

      useEffect(() => {
        const update = () => setDims({ w: window.innerWidth, h: window.innerHeight });
        update();
        window.addEventListener('resize', update);
        return () => window.removeEventListener('resize', update);
      }, []);

      const t = COPY[locale];
      const formatted = formatReportInstant(ISO_INSTANT, locale);
      const vw = dims.w > 0 ? dims.w + '×' + dims.h : '…';

      const accountItems = useMemo(() => ({
        items: [{ key: 'logout', label: t.logout }],
      }), [t]);

      function navLink(key, label) {
        const active = page === key;
        return React.createElement('a', {
          href: '#',
          className: active ? 'active' : '',
          onClick: (e) => { e.preventDefault(); setPage(key); },
          'data-nav': key,
        }, label);
      }

      function SurfaceBlock({ testId, children }) {
        if (uiState === 'denied') {
          return React.createElement(Result, {
            status: '403',
            title: t.denied,
            subTitle: React.createElement('span', { className: 'fixture-label' }, '[fixture: denied]'),
          });
        }
        if (uiState === 'loading') {
          return React.createElement('div', { 'data-testid': testId || 'loading-surface', style: { textAlign: 'center', padding: 48 } },
            React.createElement('div', { className: 'pd-spinner', 'data-testid': 'pd-spinner', role: 'status', 'aria-label': t.loading }),
            React.createElement('div', { style: { marginTop: 12 } }, t.loading)
          );
        }
        if (uiState === 'error') {
          return React.createElement(Alert, {
            type: 'error',
            showIcon: true,
            message: t.errorGuests,
            action: React.createElement(Button, { size: 'small', onClick: () => setUiState('ready') }, t.retry),
          });
        }
        if (uiState === 'unknown') {
          return React.createElement(Alert, { type: 'warning', showIcon: true, message: t.unknownSurface });
        }
        return children;
      }

      function GuestsPanel() {
        if (uiState === 'denied') {
          return React.createElement(Result, {
            status: '403',
            title: t.denied,
            subTitle: React.createElement('span', { className: 'fixture-label' }, '[fixture: denied]'),
          });
        }
        if (uiState === 'loading') {
          return React.createElement('div', { 'data-testid': 'loading-surface', style: { textAlign: 'center', padding: 48 } },
            React.createElement('div', { className: 'pd-spinner', 'data-testid': 'pd-spinner', role: 'status', 'aria-label': t.loading }),
            React.createElement('div', { style: { marginTop: 12 } }, t.loading),
            rmQuery ? React.createElement(Tag, { color: 'gold' }, t.reducedMotion) : null
          );
        }

        const tabItems = [
          { key: 'import', label: t.tabImport },
          { key: 'pending', label: t.tabPending },
          { key: 'notifications', label: t.tabNotify },
          { key: 'export', label: t.tabExport },
        ];

        const catalogFilters = tab === 'import' ? React.createElement(
          'div',
          { 'data-testid': 'import-catalog-filters', style: { marginBottom: 16 } },
          React.createElement(Space, { wrap: true },
            React.createElement('div', null,
              React.createElement('label', { id: 'src-lbl', style: { display: 'block', fontSize: 12 } }, t.importCatalog),
              React.createElement(Select, { 'aria-labelledby': 'src-lbl', style: { width: 200 }, placeholder: t.importCatalog, options: [{ value: 's1', label: 'Partner API (fixture)' }] })
            ),
            React.createElement('div', null,
              React.createElement('label', { id: 'type-lbl', style: { display: 'block', fontSize: 12 } }, t.importType),
              React.createElement(Select, { 'aria-labelledby': 'type-lbl', style: { width: 200 }, placeholder: t.importType, options: [{ value: 'ga', label: 'GA (fixture)' }] })
            )
          )
        ) : null;

        let tabBody;
        if (tab === 'import') {
          tabBody = React.createElement(Alert, { type: 'info', showIcon: true, message: t.importDesc, style: { marginBottom: 12 } });
        } else if (tab === 'pending') {
          tabBody = uiState === 'empty'
            ? React.createElement(Empty, { description: t.emptyGuests })

              size: 'small',
              pagination: false,

              locale: uiState === 'error' ? { emptyText: t.errorGuests } : undefined,
            });
        } else if (tab === 'notifications') {
          tabBody = React.createElement(Alert, { type: 'warning', showIcon: true, message: t.notifySummary });
        } else {
          tabBody = React.createElement('div', null,
            React.createElement(Typography.Paragraph, null, t.exportDesc),

      function AuditFixture() {
        const auditBody = uiState === 'empty'
          ? React.createElement(Empty, { description: t.auditEmpty })

          : React.createElement(Table, {

            pagination: false,

            columns: [
              { title: locale === 'vi' ? 'Mã (đã che)' : 'Code (masked)', dataIndex: 'code' },

        const jobsBody = React.createElement('div', { 'data-testid': 'export-jobs-panel' },
          React.createElement(Alert, {
            type: 'info',
            showIcon: true,

        const auditPanel = React.createElement('div', { 'data-testid': 'audit-log-panel' },
          React.createElement(Alert, { type: 'info', showIcon: true, message: t.auditFilterHint, style: { marginBottom: 12 } }),

            React.createElement(Input, { placeholder: t.auditActionPh, style: { minWidth: 160 }, 'data-testid': 'audit-filter-action' }),

        const codesPanel = React.createElement('div', { 'data-testid': 'codes-panel' },

        return React.createElement(Card, { title: t.navAudit, 'data-testid': 'audit-procard' },
          React.createElement(Tabs, {
            activeKey: auditTab,
            onChange: setAuditTab,
