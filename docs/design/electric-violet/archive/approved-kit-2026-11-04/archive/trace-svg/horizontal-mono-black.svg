    PROVENANCE: contour trace of the approved raster, batch 2/2 fix for EV-01/EV-02
    (docs/design/electric-violet/sources/approved-logo-suite.png). ROI
    x300..1250,y150..400 of the 1536x1024 board (wide ROI, auto bbox, no fixed
    crop that could clip glyphs). Mark = HSV color mask (V>150 & S>100: violet
    is bright+saturated vs. a bright+low-sat background and dark ink) traced
    with cv2.findContours(RETR_CCOMP) + approxPolyDP(epsilon=0.25px — dense,
    not hand-fit). Wordmark = HSV mask (V<100) traced the same way,
    fill-rule evenodd for letter counters (e/o holes). No hand-measured
    vertices, no <text>/font, no raster embed. Mark and wordmark share this
    exact ROI pixel coordinate space (viewBox "0 0 950 250") — translation
    only, no guessed offsets. A translate(0.5,0.5) on both groups corrects the
    half-pixel contour-grid vs. SVG-pixel-center convention mismatch (found by
    IoU sweep). Measured silhouette IoU vs. the approved source mask at 4x
    supersample: mark 0.9902, wordmark 0.9854 (both >= 0.98 gate). Evidence:
    docs/design/electric-violet/sources/mark-comparison.png,
    wordmark-comparison.png, REPORT.md.
  -->
