name: Setup pnpm + Node + Turbo cache
description: >
  Installs pnpm/Node (pnpm store via setup-node). Restores merged local Turbo
  cache under .turbo (ADR-11 — no Turbo Remote/SaaS).
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    # Prefer newest cache for this lockfile (merged blob from turbo-persist).
    - name: Restore Turbo cache (local .turbo, không remote)
      uses: actions/cache/restore@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-merged
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-
    - shell: bash
      run: pnpm install --frozen-lockfile
