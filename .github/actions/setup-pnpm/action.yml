name: Setup pnpm + Node + Turbo cache
description: >
  Installs pnpm/Node (pnpm store via setup-node). Restores local Turbo cache
  under .turbo (ADR-11 — no Turbo Remote/SaaS). Save is a separate step so
  parallel jobs can each persist under unique keys while sharing restores.
inputs:
  turbo-job:
    description: Job id used only for the save key (allows parallel saves)
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    # Shared restore across jobs/runs. Exact key rarely hits (per-SHA); restore-keys
    # pick the newest turbo-* blob for this lockfile so contracts/web/backend warm each other.
    - name: Restore Turbo cache (local .turbo, không remote)
      id: turbo-restore
      uses: actions/cache/restore@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-
    - shell: bash
      run: pnpm install --frozen-lockfile
