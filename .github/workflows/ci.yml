# Native iOS builds: local/self-managed macOS only. Never use Expo/EAS Cloud Build.
# Không dùng Turbo Remote Cache / SaaS cache (ADR-11). Chỉ cache local Actions `.turbo`.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Local filesystem cache only — never set TURBO_TOKEN / remote cache.
  TURBO_CACHE_DIR: .turbo
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phát hiện thay đổi chỉ docs/**
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "scope=push-main (full checks)"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t FILES < <(git diff --name-only "${BASE}...${HEAD}")
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "scope=empty-diff (full checks)"
            exit 0
          fi
          docs_only=true
          for f in "${FILES[@]}"; do
            # Full checks bắt buộc khi đụng contracts/lockfile/tooling/CI/apps/packages/infra/scripts.
            if [[ ! "$f" =~ ^docs/ ]]; then
              docs_only=false
              break
            fi
          done
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "scope files=${#FILES[@]} docs_only=${docs_only}"
      - name: Bỏ qua lint/typecheck/test/build (chỉ docs/**)
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          echo "PR chỉ đổi docs/** — giữ tên job check xanh, không chạy full pipeline."
          echo "Xem docs/reviews/PROCESS-CI-PR-HYGIENE.md"
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.docs_only != 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Turbo (local .turbo, không remote)
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm lint
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm build
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @ticket/web test:routes
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @ticket/api openapi
      - if: steps.scope.outputs.docs_only != 'true'
        run: git diff --exit-code -- apps/api/openapi.json
  database-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phát hiện thay đổi chỉ docs/**
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t FILES < <(git diff --name-only "${BASE}...${HEAD}")
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          for f in "${FILES[@]}"; do
            if [[ ! "$f" =~ ^docs/ ]]; then
              docs_only=false
              break
            fi
          done
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
      - name: Bỏ qua test:db (chỉ docs/**)
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "PR chỉ đổi docs/** — bỏ qua database-isolation nặng."
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.docs_only != 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Turbo (local .turbo, không remote)
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-db-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            turbo-db-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-db-${{ runner.os }}-
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      # backend tsc resolves @ticket/contracts from dist — build workspace dep first
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @ticket/contracts build
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @ticket/backend test:db
  # Issue #25 — root drills (throwaway Docker Postgres; not production SLO)
  d5-hardening-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API (restore reconnect + metrics E2E deps)
        run: |
          pnpm --filter @ticket/contracts build
          pnpm --filter @ticket/backend build
          pnpm --filter @ticket/api build
      - name: Observability artifact smoke
        run: ./scripts/d5-observability-smoke.sh
      - name: Fixture backup drill
        run: ./scripts/d5-backup-drill.sh
      - name: Business + key restore drill
        run: ./scripts/d5-business-restore-drill.sh
      - name: Admission S4 isolated (nginx edge)
        run: ./scripts/d5-admission-s4.sh
      - name: R-INT tenant host / cache / cookie unit
        run: pnpm test:rint-host
      - name: R-INT stack manifest smoke
        run: ./scripts/rint-stack-smoke.sh
      - name: R-INT outbox Redis-loss + lease reclaim
        run: ./scripts/rint-outbox-recovery.sh
      # Full PRD 2×20k + sustained S3 needs local Keycloak + long runtime — not CI.
