# Native iOS builds: local/self-managed macOS only. Never use Expo/EAS Cloud Build.
# Không dùng Turbo Remote Cache / SaaS cache (ADR-11). Chỉ cache local Actions `.turbo`.
#
# Layout: changes → parallel scope jobs → aggregator `ci` (required check).
# PR chỉ đụng docs/** hoặc meta → gần như chỉ chạy `changes` + `ci`.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE_DIR: .turbo

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.set.outputs.docs_only }}
      web: ${{ steps.set.outputs.web }}
      mobile: ${{ steps.set.outputs.mobile }}
      backend: ${{ steps.set.outputs.backend }}
      db: ${{ steps.set.outputs.db }}
      hardening: ${{ steps.set.outputs.hardening }}
    steps:
      - uses: actions/checkout@v4
      - name: Path filters (PR)
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Predicate true nếu có ít nhất một file khớp (sau negation).
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!.gitattributes'
              - '!.editorconfig'
              - '!**/.gitkeep'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            backend:
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'packages/backend/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            db:
              - 'packages/backend/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            hardening:
              - 'scripts/d5-**'
              - 'scripts/rint-**'
              - 'scripts/lib/**'
              - 'infra/**'
              - 'docker-compose*.yml'
              - 'compose*.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
      - name: Set scope outputs
        id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "hardening=true" >> "$GITHUB_OUTPUT"
            echo "scope=push-main (full)"
            exit 0
          fi

          code="${{ steps.filter.outputs.code }}"
          web="${{ steps.filter.outputs.web }}"
          mobile="${{ steps.filter.outputs.mobile }}"
          backend="${{ steps.filter.outputs.backend }}"
          db="${{ steps.filter.outputs.db }}"
          hardening="${{ steps.filter.outputs.hardening }}"

          if [[ "$code" == "true" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            # Docs/meta-only: không chạy scope jobs.
            web=false; mobile=false; backend=false; db=false; hardening=false
          fi

          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "mobile=${mobile}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "db=${db}" >> "$GITHUB_OUTPUT"
          echo "hardening=${hardening}" >> "$GITHUB_OUTPUT"
          echo "scope code=${code} web=${web} mobile=${mobile} backend=${backend} db=${db} hardening=${hardening}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          turbo-key-prefix: turbo-web
      # Một turbo graph — lint/typecheck/test/build song song theo dependsOn.
      - run: pnpm exec turbo run lint typecheck test build --filter=@ticket/web...
      - run: pnpm --filter @ticket/web test:routes

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          turbo-key-prefix: turbo-mobile
      - run: pnpm exec turbo run lint typecheck test build --filter=@ticket/mobile...

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          turbo-key-prefix: turbo-backend
      # api + worker (+ deps contracts/backend). Không kéo web/mobile.
      - run: pnpm exec turbo run lint typecheck test build --filter=@ticket/api... --filter=@ticket/worker...
      - name: OpenAPI drift
        run: |
          pnpm --filter @ticket/api openapi
          git diff --exit-code -- apps/api/openapi.json

  database-isolation:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          turbo-key-prefix: turbo-db
      - run: pnpm --filter @ticket/contracts build
      - run: pnpm --filter @ticket/backend test:db

  d5-hardening-smoke:
    needs: changes
    if: needs.changes.outputs.hardening == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          turbo-key-prefix: turbo-d5
      - name: Build API (restore reconnect + metrics E2E deps)
        run: |
          pnpm --filter @ticket/contracts build
          pnpm --filter @ticket/backend build
          pnpm --filter @ticket/api build
      - name: Observability artifact smoke
        run: ./scripts/d5-observability-smoke.sh
      - name: Fixture backup drill
        run: ./scripts/d5-backup-drill.sh
      - name: Business + key restore drill
        run: ./scripts/d5-business-restore-drill.sh
      - name: Admission S4 isolated (nginx edge)
        run: ./scripts/d5-admission-s4.sh
      - name: R-INT tenant host / cache / cookie unit
        run: pnpm test:rint-host
      - name: R-INT stack manifest smoke
        run: ./scripts/rint-stack-smoke.sh
      - name: R-INT outbox Redis-loss + lease reclaim
        run: ./scripts/rint-outbox-recovery.sh

  # Single required status check: skipped scope jobs are OK; failures fail the gate.
  ci:
    needs:
      - changes
      - web
      - mobile
      - backend
      - database-isolation
      - d5-hardening-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate scope results
        shell: bash
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          if [[ "$changes" != "success" ]]; then
            echo "changes job: $changes"
            exit 1
          fi

          fail=0
          for pair in \
            "web:${{ needs.web.result }}" \
            "mobile:${{ needs.mobile.result }}" \
            "backend:${{ needs.backend.result }}" \
            "database-isolation:${{ needs.database-isolation.result }}" \
            "d5-hardening-smoke:${{ needs.d5-hardening-smoke.result }}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "job ${name}=${result}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::CI scope job failed: ${name} (${result})"
                fail=1
                ;;
            esac
          done

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

          echo "CI scopes OK (docs_only=${{ needs.changes.outputs.docs_only }} web=${{ needs.changes.outputs.web }} mobile=${{ needs.changes.outputs.mobile }} backend=${{ needs.changes.outputs.backend }} db=${{ needs.changes.outputs.db }} hardening=${{ needs.changes.outputs.hardening }})"
