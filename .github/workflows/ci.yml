# Native iOS builds: local/self-managed macOS only. Never use Expo/EAS Cloud Build.
# Không dùng Turbo Remote Cache / SaaS cache (ADR-11). Chỉ cache local Actions `.turbo`.
#
# Layout: changes → parallel scopes (web/mobile/backend + db matrix + d5×3) → `ci`.
# PR chỉ đụng docs/** hoặc meta → gần như chỉ chạy `changes` + `ci`.
# Turbo: restore chung theo lockfile; web/mobile/backend upload shard → turbo-persist merge.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE_DIR: .turbo

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.set.outputs.docs_only }}
      web: ${{ steps.set.outputs.web }}
      mobile: ${{ steps.set.outputs.mobile }}
      backend: ${{ steps.set.outputs.backend }}
      db: ${{ steps.set.outputs.db }}
      hardening: ${{ steps.set.outputs.hardening }}
    steps:
      - uses: actions/checkout@v4
      - name: Path filters (PR)
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Predicate true nếu có ít nhất một file khớp (sau negation).
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!.gitattributes'
              - '!.editorconfig'
              - '!**/.gitkeep'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            backend:
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'packages/backend/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            db:
              - 'packages/backend/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            hardening:
              - 'scripts/d5-**'
              - 'scripts/rint-**'
              - 'scripts/lib/**'
              - 'infra/**'
              - 'docker-compose*.yml'
              - 'compose*.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
      - name: Set scope outputs
        id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "hardening=true" >> "$GITHUB_OUTPUT"
            echo "scope=push-main (full)"
            exit 0
          fi

          code="${{ steps.filter.outputs.code }}"
          web="${{ steps.filter.outputs.web }}"
          mobile="${{ steps.filter.outputs.mobile }}"
          backend="${{ steps.filter.outputs.backend }}"
          db="${{ steps.filter.outputs.db }}"
          hardening="${{ steps.filter.outputs.hardening }}"

          if [[ "$code" == "true" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            # Docs/meta-only: không chạy scope jobs.
            web=false; mobile=false; backend=false; db=false; hardening=false
          fi

          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "mobile=${mobile}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "db=${db}" >> "$GITHUB_OUTPUT"
          echo "hardening=${hardening}" >> "$GITHUB_OUTPUT"
          echo "scope code=${code} web=${web} mobile=${mobile} backend=${backend} db=${db} hardening=${hardening}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      # Một turbo graph — lint/typecheck/test/build song song theo dependsOn.
      - run: pnpm exec turbo run lint typecheck test build --filter=@ticket/web...
      - run: pnpm --filter @ticket/web test:routes
      - uses: ./.github/actions/save-turbo
        if: success()
        with:
          turbo-job: web

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec turbo run lint typecheck test build --filter=@ticket/mobile...
      - uses: ./.github/actions/save-turbo
        if: success()
        with:
          turbo-job: mobile

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      # api + worker (+ deps contracts/backend). Không kéo web/mobile.
      - run: pnpm exec turbo run lint typecheck test build --filter=@ticket/api... --filter=@ticket/worker...
      - name: OpenAPI drift
        run: |
          pnpm --filter @ticket/api openapi
          git diff --exit-code -- apps/api/openapi.json
      - uses: ./.github/actions/save-turbo
        if: success()
        with:
          turbo-job: backend

  # Mỗi file test:db tự spin Postgres — shard matrix để song song (critical path).
  database-isolation:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mỗi file tự Docker — concurrency trong shard + 4 shard cân tải.
          - shard: rls
            files: test/rls.test.cjs test/rls-catalog.test.cjs
          - shard: membership-report
            files: test/membership.test.cjs test/reporting.test.cjs
          - shard: issue-gate-approval
            files: test/issue.test.cjs test/gate.test.cjs test/approval.test.cjs
          - shard: config-n1-lifecycle
            files: test/config-publish.test.cjs test/n1-email-mime.test.cjs test/event-lifecycle.test.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec turbo run build --filter=@ticket/backend...
      - name: DB tests (${{ matrix.shard }})
        working-directory: packages/backend
        run: node --test --test-concurrency=4 ${{ matrix.files }}

  # D5 drills tách 3 job song song (ports/container name độc lập).
  d5-observability:
    needs: changes
    if: needs.changes.outputs.hardening == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec turbo run build --filter=@ticket/api...
      - run: ./scripts/d5-observability-smoke.sh

  d5-drills:
    needs: changes
    if: needs.changes.outputs.hardening == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec turbo run build --filter=@ticket/api...
      - name: Backup + business restore + admission (parallel)
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/d5-backup-drill.sh &
          p1=$!
          ./scripts/d5-business-restore-drill.sh &
          p2=$!
          ./scripts/d5-admission-s4.sh &
          p3=$!
          fail=0
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          wait "$p3" || fail=1
          exit "$fail"

  d5-rint:
    needs: changes
    if: needs.changes.outputs.hardening == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec turbo run build --filter=@ticket/api...
      - run: pnpm test:rint-host
      - run: ./scripts/rint-stack-smoke.sh
      - run: ./scripts/rint-outbox-recovery.sh

  # Merge turbo shards from scope jobs into one Actions cache (content-addressed).
  turbo-persist:
    needs: [web, mobile, backend]
    if: always() && (needs.web.result == 'success' || needs.mobile.result == 'success' || needs.backend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download turbo shards
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: turbo-shard-*
          path: /tmp/turbo-shards
          merge-multiple: false
      - name: Merge shards into .turbo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .turbo
          if [[ ! -d /tmp/turbo-shards ]]; then
            echo "no turbo shards to merge"
            exit 0
          fi
          shopt -s nullglob
          for shard in /tmp/turbo-shards/*/; do
            echo "merging shard $(basename "$shard")"
            if [[ -d "${shard}.turbo" ]]; then
              src="${shard}.turbo"
            else
              src="${shard%/}"
            fi
            # Content-addressed: copy all files; keep larger on collision
            while IFS= read -r -d '' f; do
              rel="${f#"$src"/}"
              dest=".turbo/${rel}"
              mkdir -p "$(dirname "$dest")"
              if [[ -f "$dest" ]] && [[ "$(wc -c < "$f")" -le "$(wc -c < "$dest")" ]]; then
                continue
              fi
              cp -f "$f" "$dest"
            done < <(find "$src" -type f -print0)
          done
          echo "merged turbo files: $(find .turbo -type f | wc -l)"
          du -sh .turbo || true
      - name: Save merged Turbo cache
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-merged

  # Single required status check: skipped scope jobs are OK; failures fail the gate.
  ci:
    needs:
      - changes
      - web
      - mobile
      - backend
      - database-isolation
      - d5-observability
      - d5-drills
      - d5-rint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate scope results
        shell: bash
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          if [[ "$changes" != "success" ]]; then
            echo "changes job: $changes"
            exit 1
          fi

          fail=0
          for pair in \
            "web:${{ needs.web.result }}" \
            "mobile:${{ needs.mobile.result }}" \
            "backend:${{ needs.backend.result }}" \
            "database-isolation:${{ needs.database-isolation.result }}" \
            "d5-observability:${{ needs.d5-observability.result }}" \
            "d5-drills:${{ needs.d5-drills.result }}" \
            "d5-rint:${{ needs.d5-rint.result }}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "job ${name}=${result}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::CI scope job failed: ${name} (${result})"
                fail=1
                ;;
            esac
          done

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

          echo "CI scopes OK (docs_only=${{ needs.changes.outputs.docs_only }} web=${{ needs.changes.outputs.web }} mobile=${{ needs.changes.outputs.mobile }} backend=${{ needs.changes.outputs.backend }} db=${{ needs.changes.outputs.db }} hardening=${{ needs.changes.outputs.hardening }})"
