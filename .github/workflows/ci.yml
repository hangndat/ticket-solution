# Native iOS builds: local/self-managed macOS only. Never use Expo/EAS Cloud Build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @ticket/web test:routes
      - run: pnpm --filter @ticket/api openapi
      - run: git diff --exit-code -- apps/api/openapi.json
  database-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # backend tsc resolves @ticket/contracts from dist — build workspace dep first
      - run: pnpm --filter @ticket/contracts build
      - run: pnpm --filter @ticket/backend test:db
  # Issue #25 — root drills (throwaway Docker Postgres; not production SLO)
  d5-hardening-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observability artifact smoke
        run: ./scripts/d5-observability-smoke.sh
      - name: Fixture backup drill
        run: ./scripts/d5-backup-drill.sh
      - name: Business + key restore drill
        run: ./scripts/d5-business-restore-drill.sh
      # Full PRD 2×20k + 50 scanners needs local Keycloak + long runtime — not CI.
